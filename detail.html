<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- Favicons -->

    <!-- Vendor CSS -->
    <link

    />
    <link

      rel="stylesheet"
    />
    <link href="assets/vendor/aos/aos.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />

    <!-- Tailwind CSS -->
    <!-- <link href="./output.css" rel="stylesheet" /> -->

    <!-- Main CSS -->
    <link href="assets/css/main.css" rel="stylesheet" />

    <!-- Alpine.js (один раз) -->
    <script src="https://unpkg.com/alpinejs" defer></script>

    <!-- Tailwind CDN (с плагинами) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp,container-queries"></script>

    <meta name="csrf-token" content="{{ csrf_token }}" />
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="index-page">
    <header
      id="header"
      class="header d-flex align-items-center fixed-top xl:px-[30px]"
    >
      <div
        class="container position-relative flex align-items-center items-center fl justify-between"
      >
        <a
          href="index.html"
          class="logo d-flex align-items-center me-auto me-xl-0"
        >
          <h2 class="sitename sm:text-2xl md:text-2xl lg:text-3xl font-bold">
            ALVERON
          </h2>
        </a>

        <nav id="navmenu" class="navmenu">
          <ul>
            <li>
              <a
                data-uz="Bosh Sahifa"
                data-ru="Главная"
                data-en="Home"
                href="index.html#home"
                class="active"
              ></a>
            </li>
            <li>
              <a
                data-uz="Haqimizda"
                data-ru="О нас"
                data-en="About"
                href="index.html#about"
              ></a>
            </li>
            <li id="category-links" class="dropdown">
              <a
                data-uz="Kategoriya"
                data-ru="Категория"
                data-en="Category"
                href="index.html#category"
                ><span>Dropdown</span>
                <i class="bi bi-chevron-down toggle-dropdown"></i
              ></a>
              <ul>
                <!-- Bu yerga JavaScript orqali <li><a>kategoriya</a></li> lar qo‘shiladi -->
              </ul>
            </li>
            <li>
              <a
                data-uz="Qanday Ishlaymiz"
                data-ru="Как Мы Работаем"
                data-en="How We Work"
                href="index.html#howwework"
              ></a>
            </li>
            <li>
              <a
                data-uz="Hamkorlarimiz"
                data-ru="Партнеры"
                data-en="Patners"
                href="index.html#partners"
              ></a>
            </li>
            <li>
              <a
                data-uz="Savollar"
                data-ru="Вопросы"
                data-en="Questions"
                href="index.html#questions"
              ></a>
            </li>

            <li>
              <a
                data-uz="Aloqa"
                data-ru="Контакт"
                data-en="Contact"
                href="contact.html"
              ></a>
            </li>
          </ul>
          <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
        </nav>
        <div class="flex items-center xl:mr-0 md:mr-2">
          <a
            data-uz="Murojaat qilish"
            data-ru="Связаться"
            data-en="Connect"
            class="btn-getstarted"
            href="murojat.html"
            >Murojat qilish</a
          >

          <!-- TIL TANLASH -->
          <div class="lang-switcher relative mx-3">
            <div
              class="btnlan lang-icon cursor-pointer text-white font-bold px-[10px] py-1 bg-[#e59d02] rounded"
              id="langToggle"
            >
              <i class="fa-solid fa-earth-americas"></i>
            </div>
            <div
              id="langMenu"
              class="lang-options absolute right-0 mt-2 bg-stone-800 rounded-lg shadow-lg z-50 transform transition-all duration-300 origin-top scale-y-0 opacity-0"
            >
              <button
                onclick="changeLang('uz')"
                class="block w-full lg:px-4 px-2 py-2 text-left text-white hover:bg-gray-800 hover:rounded-lg"
              >
                UZ
              </button>
              <button
                onclick="changeLang('ru')"
                class="block w-full lg:px-4 px-2 py-2 text-left text-white hover:bg-gray-800 hover:rounded-lg"
              >
                RU
              </button>
              <button
                onclick="changeLang('en')"
                class="block w-full lg:px-4 px-2 py-2 text-left text-white hover:bg-gray-800 hover:rounded-lg"
              >
                EN
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="main xl:px-[30px]">
      <div class="py-6">
        <div
          class="container xl:px-[90px] section-title mt-[100px]"
          data-aos="fade-up"
        >
          <h2
            data-uz="Texnika haqida ma'lumot"
            data-ru="Информация о технике"
            data-en="Technical Information"
            class="translatable"
          ></h2>
        </div>
        <!-- Product Content -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
          <div id="product-detail" class="flex flex-col md:flex-row -mx-4">
            <!-- JS dynamically injects content here -->
          </div>
        </div>
      </div>

      <script src="https://unpkg.com/alpinejs" defer></script>
      <!-- Alpine.js-ni qo'shish -->

      <script>
        document.addEventListener("DOMContentLoaded", () => {
          const params = new URLSearchParams(window.location.search);
          let id = params.get("id");

          let currentLang =
            params.get("lang") || localStorage.getItem("lang") || "uz";
          localStorage.setItem("lang", currentLang);

          let fetchedData = null;

          // Statik matnlarni tilga moslash
          function applyLanguage() {
            document.querySelectorAll("[data-uz]").forEach((el) => {
              const text = el.getAttribute(`data-${currentLang}`);
              if (text) el.textContent = text;
            });
          }

          // Har qanday maydondan tilga mos qiymat olish
          function getLangValue(obj, field) {
            if (!obj) return "";
            if (obj[`${field}_${currentLang}`] != null) {
              return obj[`${field}_${currentLang}`];
            }
            return obj[field] || "";
          }

          // Asosiy render funksiyasi
          function renderProductDetail() {
            if (!fetchedData) return;

            const container = document.getElementById("product-detail");
            const product = Array.isArray(fetchedData.product)
              ? fetchedData.product[0]
              : fetchedData.product;
            const productImages = fetchedData.product_images || [];

            const images = productImages
              .map(
                (img, idx) => `
            <div 
              x-show="image === ${idx + 1}" 
              class="w-full h-64 md:h-[300px] md:w-[410px] lg:h-[420px] lg:w-[700px] bg-gray-100 rounded-lg flex items-center justify-center z-0 relative"
              style="display: none;"
            >
              <img src="${
                img.image
              }" class="max-h-full object-contain" alt="image-${idx + 1}">
            </div>
        `
              )
              .join("");

            const thumbnails = `
            <div class="flex flex-wrap justify-center gap-2 mt-4 md:mt-6 lg:mt-6 relative z-10">
              ${productImages
                .map(
                  (img, idx) => `
                <button 
                  x-on:click="image = ${idx + 1}" 
                  :class="{ 'ring-2 ring-indigo-400 ring-inset': image === ${
                    idx + 1
                  } }"
                  class="focus:outline-none w-20 h-20 md:w-24 md:h-24 lg:w-28 lg:h-28 rounded-lg bg-white p-1 flex items-center justify-center shadow-md"
                >
                  <img src="${
                    img.image
                  }" class="h-full object-contain" alt="thumb-${idx + 1}">
                </button>
              `
                )
                .join("")}
            </div>
        `;

            const specTypes = fetchedData.spec_types || [];
            const specsData = fetchedData.spec || [];

            const specs = specTypes
              .map((type) => {
                const filtered = specsData.filter(
                  (s) => s.spec_type === type.id
                );
                return filtered
                  .map(
                    (s) =>
                      `<li><strong>${getLangValue(
                        type,
                        "name"
                      )}:</strong> ${getLangValue(s, "value")}</li>`
                  )
                  .join("");
              })
              .join("");

            container.innerHTML = `
          <div class="md:flex-1 px-4" x-data="{ image: 1 }" x-cloak>
            <div class="w-full">
              ${images}
              ${thumbnails}
            </div>
          </div>

          <div class="md:flex-1 px-4">
            <h2 class="mb-2 leading-tight tracking-tight font-[900] sm:mt-0 mt-10 text-2xl md:text-4xl text-[#e59d02]">
              ${getLangValue(product, "name")}
            </h2>
            <p class="text-gray-500 text-2xl text-white font-[900] mt-[20px] sm:mt-[50px]">
              <span class="text-[#e59d02] text-2xl font-bold" data-uz="Yil:  " data-ru="Год:  " data-en="Year:  "></span>
            </p>

            <h5 class="font-bold mb-2 text-2xl text-[#e59d02]"
                data-uz="Tavsif"
                data-ru="Описание"
                data-en="Description">
              Tavsif
            </h5>

            <p class="text-white mb-4">
              ${
                getLangValue(product, "description") ||
                (currentLang === "uz"
                  ? "Tavsif mavjud emas"
                  : currentLang === "ru"
                  ? "Описание отсутствует"
                  : "No description available")
              }
            </p>

            <h5 class="font-bold mb-2 text-[#e59d02] text-2xl"
                data-uz="Xususiyatlari"
                data-ru="Характеристики"
                data-en="Specifications">
              Xususiyatlari
            </h5>

            <ul class="list-disc list-inside text-white mb-6">${specs}</ul>

            <button 
              class="rounded-xl sm:py-4 w-full h-[60px] text-xl font-[900] sm:px-10 py-2 px-6 text-white hover:bg-[#cf5f02] bg-[#da7c09] primary"
              data-uz="Murojaat qilish" 
              data-ru="Связаться" 
              data-en="Connect"
              onclick="window.location.href='murojat.html'">
              Murojat qilish
            </button>
          </div>
        `;

            applyLanguage();
          }

          // Tilni o‘zgartirish
          window.changeLang = function (lang) {
            currentLang = lang;
            localStorage.setItem("lang", lang);
            renderProductDetail();
          };

          // API’dan olish
          if (id) {
            fetch(`https://alveron.onrender.com/detail/${id}/`)
              .then((res) => res.json())
              .then((data) => {
                fetchedData = data;
                renderProductDetail();
              })
              .catch((error) => {
                document.getElementById(
                  "product-detail"
                ).innerHTML = `<p class="text-red-500">Xatolik: ${error.message}</p>`;
              });
          }
        });
      </script>
    </main>

    <!-- Scroll Top -->
    <a
      href="#"
      id="scroll-top"
      class="scroll-top d-flex align-items-center justify-content-center"
      ><i class="bi bi-arrow-up-short"></i
    ></a>
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/vendor/aos/aos.js"></script>

    <!-- Main JS -->
    <script src="assets/js/detail.js"></script>
  </body>
</html>
