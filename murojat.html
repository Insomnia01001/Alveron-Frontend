<span>Xabar yuborish</span>
<i class="bi bi-arrow-right"></i>
</button>

            <!-- 🔒 CSRF Helper -->

            <script>
                function getCSRFToken() {
                    let cookieValue = null;
                    if (document.cookie && document.cookie !== '') {
                        const cookies = document.cookie.split(';');
                        for (let cookie of cookies) {
                            cookie = cookie.trim();
                            if (cookie.startsWith('csrftoken=')) {
                                cookieValue = decodeURIComponent(cookie.substring('csrftoken='.length));
                                break;
                            }
                        }
                    }
                    return cookieValue;
                }

                window.addEventListener('DOMContentLoaded', () => {
                    const contactForm = document.getElementById('contactForm');
                    if (!contactForm) return;

                    contactForm.addEventListener('submit', async function(e) {
                        e.preventDefault();

                        const form = e.target;
                        const loading = form.querySelector('.loading');
                        const errorMsg = form.querySelector('.error-message');
                        const sentMsg = form.querySelector('.sent-message');
                        const submitBtn = form.querySelector('button[type="submit"]');

                        loading.style.display = 'block';
                        errorMsg.style.display = 'none';
                        sentMsg.style.display = 'none';
                        errorMsg.textContent = '';
                        sentMsg.textContent = '';

                        const formData = {
                            name: form.name.value,
                            number: form.number.value,
                            message: form.message.value
                        };

                        try {
                            let lang = localStorage.getItem("lang") || "uz";

                            const response = await fetch('https://alveron-production.up.railway.app/connect/', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-CSRFToken': getCSRFToken(), // 🔥 Har safar cookie’dan o‘qiladi
                                    'Accept-Language': lang
                                },
                                credentials: 'include',
                                body: JSON.stringify(formData)
                            });

                            const data = await response.json();
                            loading.style.display = 'none';

                            if (response.ok) {
                                let btnText = (lang === 'ru') ? '✅ Отправлено!' :
                                    (lang === 'en') ? '✅ Sent!' : '✅ Yuborildi!';

                                submitBtn.innerHTML = btnText;
                                form.reset();

                                setTimeout(() => {
                                    let defaultText = (lang === 'ru') ? '<span>Отправить сообщение</span><i class="bi bi-arrow-right"></i>' :
                                        (lang === 'en') ? '<span>Send Message</span><i class="bi bi-arrow-right"></i>' :
                                        '<span>Xabar yuborish</span><i class="bi bi-arrow-right"></i>';
                                    submitBtn.innerHTML = defaultText;
                                }, 3500);

                            } else {
                                errorMsg.style.display = 'block';
                                errorMsg.style.background = 'red';
                                errorMsg.style.borderRadius = '10px';

                                let msg = Object.values(data.errors || {}).flat().join('\n');
                                if (!msg) {
                                    msg = (lang === 'ru') ? "Вы отправили слишком много сообщений, пожалуйста, подождите 1 минуту" :
                                        (lang === 'en') ? "You have sent too many messages, please wait 1 minute" :
                                        "Juda ko‘p xabar yubordingiz, iltimos 1 minutdan keyin yuboring";
                                }
                                errorMsg.textContent = msg;

                                setTimeout(() => {
                                    errorMsg.style.display = 'none';
                                    errorMsg.textContent = '';
                                    errorMsg.style.background = 'none';
                                }, 5000);
                            }
                        } catch (error) {
                            loading.style.display = 'none';
                            errorMsg.style.display = 'block';
                            errorMsg.style.background = '#f8d7da';
                            errorMsg.textContent = 'Xatolik: ' + error.message;

                            setTimeout(() => {
                                errorMsg.style.display = 'none';
                                errorMsg.textContent = '';
                                errorMsg.style.background = 'none';
                            }, 5000);
                        }
                    });
                });
            </script>
